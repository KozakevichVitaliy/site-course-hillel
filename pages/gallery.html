<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/general.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Gallery</title>
</head>
<body>
    <header class="py-0 px-[20px] h-[80px] w-[100%] bg-amber-100 fixed top-0">

    <main class="px-[20px] pt-[100px] pb-[80px]">

        <p class="text-center text-[20px] py-[30px] px-0"> Hello everyone! Here's a some fun meme Cats images - scroll horizontal to see all images!</p>
        <div class="h-[300px] flex overflow-scroll mx-auto">
            <a class="flex flex-[0_0_calc(33.333%-100px)] items-center flex-col font-['Courier New',Courier,mono] text-lg font-bold m-[5px]" href="../images/coughing-cat.jpg.webp" target="_blank" rel="noopener noreferrer"><img src="../images/coughing-cat.jpg.webp" alt="coughing-cat" class="w-[320px] h-[250px]">Coughing-cat</a>
            <a class="flex flex-[0_0_calc(33.333%-100px)] items-center flex-col font-['Courier New',Courier,mono] text-lg font-bold m-[5px]" href="../images/crumppy-cat.jpeg" target="_blank" rel="noopener noreferrer"><img src="../images/crumppy-cat.jpeg" alt="crumppy-cat" class="w-[320px] h-[250px]">Crumppy-cat</a>
            <a class="flex flex-[0_0_calc(33.333%-100px)] items-center flex-col font-['Courier New',Courier,mono] text-lg font-bold m-[5px]" href="../images/crying-cat.jpeg" target="_blank" rel="noopener noreferrer"><img src="../images/crying-cat.jpeg" alt="crying-cat" class="w-[320px] h-[250px]">Crying-cat</a>
            <a class="flex flex-[0_0_calc(33.333%-100px)] items-center flex-col font-['Courier New',Courier,mono] text-lg font-bold m-[5px]" href="../images/huh-cat.jpeg" target="_blank" rel="noopener noreferrer"><img src="../images/huh-cat.jpeg" alt="huh-cat" class="w-[320px] h-[250px]">Huh-cat</a>

            <a class="flex flex-[0_0_calc(33.333%-100px)] items-center flex-col font-['Courier New',Courier,mono] text-lg font-bold m-[5px]" href="../images/smeared-cat.jpeg" target="_blank" rel="noopener noreferrer"><img src="../images/smeared-cat.jpeg" alt="smeared-cat" class="w-[320px] h-[250px]">Smeared-cat</a>
        </div>
    </main>
    <footer class="py-0 px-[20px] h-[80px] w-[100%] bg-amber-100 fixed bottom-0">
        <object type="text/html" data="../components/footer.html" class="w-[100%]"></object>
