<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Contacts</title>
</head>
<body>
    <header class="py-0 px-[20px] h-[80px] w-[100%] bg-amber-100 fixed top-0">
        <object type="text/html" data="../components/header.html" class="w-[100%]"></object>
    </header>
    <main class="px-[20px] pt-[100px] pb-[80px]">
        <h2 class="text-center sticky top-[80px] font-bold text-2xl font-sans">Wanna get more Cats - contact us</h2>
        <p class="text-center text-[20px] py-[30px] px-0"> Tell us some more about Cats! Type a form below to contact us by email</p>
        <form action="gallery.html" class="main-form">
            <div class="form-action">
                <label for="form-email">Type your email</label>
                <input type="email" name="" id="form-email" required placeholder="Your email">
            </div>
            <div class="form-action">
                <label for="form-number">How many Cats do you have</label>
                <input type="number" name="" id="form-number">
            </div>
            <div class="form-action">
                <label for="form-file">Attach a picture of your cat</label>
                <input type="file" name="" id="form-file">
            </div>
            <div class="form-action">
                <label for="">Tell some more</label>
                <textarea id="form-textarea" placeholder="Your text" required></textarea>
            </div>
            <button type="submit" class="form-action">SUBMIT</button>
        </form>
    </main>
    <footer class="py-0 px-[20px] h-[80px] w-[100%] bg-amber-100 fixed bottom-0">
        <object type="text/html" data="../components/footer.html" class="w-[100%]"></object>
    </footer>
</body>
</html>
